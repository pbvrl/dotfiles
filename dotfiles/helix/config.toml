theme = "nightfox"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left =  [] 
center = ["read-only-indicator", "file-modification-indicator", "file-name", "total-line-numbers"]
right = [ "diagnostics", "register", "file-encoding", "spinner"]

[editor]
jump-label-alphabet = "asdfghjklqwertyuiopzxcvbnm"
true-color = true
default-yank-register = "+"

[editor.file-picker]
hidden = false
git-ignore = false

[editor.soft-wrap]
enable = true

[keys.normal]
C-r = [
    ":write-all",
    ":insert-output scooter --no-stdin >/dev/tty",
    ":redraw",
    ":reload-all"
]
