[mgr]
ratio         = [0, 1, 1]

[open]
rules = [
    { mime = "image/*", use = "image" },
    { mime = "video/*", use = "video" },
    { mime = "audio/*", use = "audio" },
    { mime = "application/pdf", use = "pdf" },
    { mime = "*", use = "edit" }
]

[opener]
image = [ { run = 'firefox %s', block = true }, ]
video = [ { run = 'firefox %s', block = true }, ]
audio = [ { run = 'firefox %s', block = true }, ]
pdf = [ { run = 'sioyek %s', block = true }, ]
edit = [ { run = 'hx %s', block = true }, ]
