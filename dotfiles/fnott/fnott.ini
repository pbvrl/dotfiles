[main]
anchor=bottom-left
layer=top
stacking-order=top-down
edge-margin-vertical=23
edge-margin-horizontal=0
notification-margin=5

min-width=0
max-width=1100
max-height=0

border-radius=5
border-size=0
padding-vertical=6
padding-horizontal=8

max-icon-size=0

title-font=Hack:size=9
summary-font=Hack:size=9
body-font=Hack:size=9

title-format=
summary-format=<i>%s</i>
body-format=%b

background=00ffffff
title-color=000000ff
summary-color=000000ff
body-color=000000ff

default-timeout=7

[low]
background=a8a8a8ff
title-color=000000ff
summary-color=000000ff
body-color=000000ff
default-timeout=7

[normal]
background=00ffffff
title-color=000000ff
summary-color=000000ff
body-color=000000ff
default-timeout=0

[critical]
background=daa520ff
title-color=000000ff
summary-color=000000ff
body-color=000000ff
default-timeout=0
